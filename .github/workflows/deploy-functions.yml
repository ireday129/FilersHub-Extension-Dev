name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: yjbteykmsvsgvndgnziw

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Public Functions (No JWT Check)
        run: |
          supabase functions deploy crm-auth --project-ref $PROJECT_ID --no-verify-jwt
          supabase functions deploy crm-webhook --project-ref $PROJECT_ID --no-verify-jwt
          supabase functions deploy crm-logo-lookup --project-ref $PROJECT_ID --no-verify-jwt

      - name: Deploy Protected Functions (Require JWT)
        run: |
          supabase functions deploy crm-users --project-ref $PROJECT_ID
          supabase functions deploy crm-update --project-ref $PROJECT_ID
          supabase functions deploy crm-logo-sync --project-ref $PROJECT_ID
