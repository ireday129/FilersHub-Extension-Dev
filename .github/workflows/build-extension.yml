name: Build Chrome Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'supabase/functions/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build extension (relative paths for Chrome)
        run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: filershub-chrome-extension
          path: dist/
